[project]
name = "LLSIFTeamBuilder"
version = "0.0.2"
description = "Simulation environment and team builder for LLSIF"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest",
]
team_builder = [
    "stable-baselines3>=2.6.0",
    "sb3-contrib>=2.6.0",
    "torch>=2.7.0",
    "gymnasium>=1.1.1",
    "cloudpickle>=3.1.1",
    "pandas>=2.2.3",
    "matplotlib>=3.10.3",
    "tensorboard>=2.19.0",
]